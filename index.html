<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>財富氣象台｜現金流棋盤</title>
<style>
  :root{
    --navy: #14213D;
    --navy-deep: #0D1730;
    --cream: #F4EEDD;
    --gold: #F2B705;
    --gold-deep: #C89400;
    --storm: #6B5B95;
    --mint: #4FB894;
    --mint-deep: #37906F;
    --coral: #E85D4C;
    --sky: #7FA8C9;
    --calm: #9AA5B8;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at 50% -10%, #1E2E54 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color: var(--cream);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .stage{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; }

  .topbar{ width:100%; max-width:640px; display:flex; justify-content:space-between; align-items:center; padding:6px 4px 14px; gap:12px; }
  .group-tag{ font-size:14px; opacity:0.75; background:rgba(244,238,221,0.08); border:1px solid rgba(244,238,221,0.2); padding:5px 12px; border-radius:999px; }
  .round-tag{ font-size:12px; opacity:0.6; background:rgba(244,238,221,0.06); border:1px solid rgba(244,238,221,0.16); padding:5px 10px; border-radius:999px; white-space:nowrap; }
  .draw-count{ font-size:14px; opacity:0.75; white-space:nowrap; }
  .settle-countdown{ font-size:11.5px; color:var(--gold); font-weight:700; white-space:nowrap; background:rgba(242,183,5,0.14); border:1px solid rgba(242,183,5,0.35); padding:4px 10px; border-radius:999px; }
  .draw-count b{ color:var(--gold); font-weight:800; }

  .headline{ text-align:center; margin-bottom:14px; }
  .headline .kicker{ font-size:13px; letter-spacing:0.12em; color:var(--sky); margin-bottom:4px; }
  .headline h1{ margin:0; font-size:24px; font-weight:800; white-space:nowrap; }
  .headline h1 span{ color:var(--gold); }
  .stats-bar{ display:none; } /* replaced by persistent side player boxes */

  .icon-legend{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 16px;
    margin: 0 auto 18px; max-width:760px; padding: 0 10px;
  }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; opacity:0.88; white-space:nowrap; }
  .legend-item .icon-chip{
    width:26px; height:26px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .legend-item .icon-chip svg{ width:16px; height:16px; }
  .legend-item .icon-chip img{ width:16px; height:16px; }

  /* ---------- game layout: side player boxes flank the board ---------- */
  .game-layout{
    display:flex; align-items:center; justify-content:center;
    gap:12px; width:100%; max-width:1180px; flex-wrap:wrap;
  }
  .side-players{
    display:flex; flex-direction:column; gap:12px;
    width:290px;
    width:clamp(228px, 30vw, 290px);
    flex:none;
  }
  .player-box{
    border-radius:14px; padding:14px 16px; width:100%;
    background: rgba(244,238,221,0.06); border:1.5px solid rgba(244,238,221,0.16);
    font-size:15px; transition: border-color .2s, background .2s;
  }
  .pb-cols{ display:flex; gap:12px; }
  .pb-col-left{ flex:none; width:110px; }
  .pb-col-right{ flex:1; border-left:1px solid rgba(244,238,221,0.15); padding-left:12px; min-width:0; }
  .player-box.active{
    border-color: var(--gold); background: rgba(242,183,5,0.16);
    box-shadow: 0 0 0 2px rgba(242,183,5,0.2);
  }
  .player-box.out{ opacity:0.4; }
  .player-box .pb-name{ font-weight:800; font-size:16.5px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .player-box .pb-num{
    width:23px; height:23px; border-radius:50%; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:800; color:#0D1730;
  }
  .player-box .pb-row{ display:flex; justify-content:space-between; opacity:0.85; line-height:2; white-space:nowrap; }
  .player-box .v-gold{ color:var(--gold); font-weight:700; }
  .player-box .v-mint{ color:var(--mint); font-weight:700; }
  .pb-section{ margin-top:9px; padding-top:9px; border-top:1px solid rgba(244,238,221,0.12); min-height:20px; }
  .pb-section-label{ font-size:10.5px; opacity:0.5; margin-bottom:4px; text-transform:none; white-space:nowrap; }
  .pb-assets{ display:flex; flex-wrap:wrap; gap:8px; min-height:20px; align-items:center; }
  .pb-asset{ font-size:17px; display:inline-flex; align-items:center; gap:1px; }
  .pb-asset b{ font-size:12px; font-weight:800; opacity:0.8; margin-left:1px; }
  .pb-empty{ font-size:14px; opacity:0.3; }
  .pb-stock-line{ font-size:13px; font-weight:700; color:var(--gold); min-height:18px; }
  .pb-chevron{ display:none; margin-left:auto; opacity:0.55; font-size:13px; transition:transform .2s; }
  .pb-quick{ display:none; }
  .pb-badges{ display:inline-flex; gap:2px; }
  .pb-badge{ font-size:14px; line-height:1; }

  /* ---------- milestone badge toast ---------- */
  .badge-toast-container{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none; width:100%; padding:0 16px;
  }
  .badge-toast{
    background: linear-gradient(135deg, #F2B705, #C89400);
    color:#241900; font-weight:800; font-size:13.5px; padding:10px 20px; border-radius:999px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.25) inset;
    display:flex; align-items:center; gap:8px; max-width:92vw; text-align:left;
    opacity:0; transform:translateY(-16px) scale(0.92);
    animation: badgeToastIn .35s ease-out forwards, badgeToastOut .35s ease-in forwards 2.75s;
  }
  .badge-toast-icon{ font-size:18px; }
  @keyframes badgeToastIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes badgeToastOut{ to{ opacity:0; transform:translateY(-12px) scale(0.94); } }

  /* ---------- bot end-of-turn recap ---------- */
  .bot-summary-list{ list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .bot-summary-list li{
    background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    border-radius:10px; padding:9px 13px; font-size:13.5px; line-height:1.4;
  }

  /* ---------- settlement / victory full screen ---------- */
  #settlementScreen{ width:100%; max-width:760px; text-align:center; animation: settleFadeIn 0.4s ease-out; }
  @keyframes settleFadeIn{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:translateY(0);} }
  .settlement-hero{
    border-radius:22px; padding:34px 26px 28px; margin-bottom:20px;
    background: linear-gradient(160deg, rgba(64,50,8,1), rgba(20,33,61,1));
    border: 1.5px solid rgba(242,183,5,0.5);
    box-shadow: 0 40px 90px -24px rgba(0,0,0,0.65);
    animation: victoryPulse 2.2s ease-in-out infinite;
  }
  .settlement-hero.plain{ background: linear-gradient(160deg, rgba(20,33,61,1), rgba(13,23,48,1)); animation:none; }
  @keyframes victoryPulse{ 0%,100%{ box-shadow:0 40px 90px -24px rgba(0,0,0,0.65), 0 0 0 0 rgba(242,183,5,0.25);} 50%{ box-shadow:0 40px 90px -24px rgba(0,0,0,0.65), 0 0 0 12px rgba(242,183,5,0);} }
  .settlement-icon{ font-size:58px; margin-bottom:8px; line-height:1; }
  .settlement-title{ font-size:26px; font-weight:900; color:var(--gold); margin-bottom:8px; }
  .settlement-sub{ font-size:14.5px; opacity:0.85; line-height:1.7; max-width:520px; margin:0 auto; }
  .settlement-rank-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; text-align:left; }
  @media (max-width:640px){ .settlement-rank-grid{ grid-template-columns: 1fr; } }
  .settlement-rank-card{ padding:15px 16px; border-radius:14px; background: rgba(244,238,221,0.06); border:1.5px solid rgba(244,238,221,0.16); }
  .settlement-rank-card.winner{ background: rgba(242,183,5,0.16); border-color: rgba(242,183,5,0.55); }
  .settlement-rank-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .settlement-medal{ font-size:24px; flex:none; width:32px; text-align:center; }
  .settlement-name{ font-weight:800; font-size:15px; flex:1; min-width:0; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .settlement-stats{ font-size:12.5px; opacity:0.85; line-height:1.75; }
  .settlement-stats b{ color:var(--gold); font-size:14px; }
  .settlement-note{ margin-top:20px; font-size:12px; opacity:0.5; line-height:1.7; }
  .settlement-reset{ margin-top:26px; }

  /* ---------- board (SVG ring, divided into colored cells) ---------- */
  .board-center-wrap{ flex:none; }
  .board-wrap{
    width: 560px; height: 560px;
    width: clamp(170px, 32vw, 480px); height: clamp(170px, 32vw, 480px);
    position:relative; margin: 0 auto 10px;
  }
  .board-svg{ position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; }
  .board-cell{ stroke: #0D1730; stroke-width: 2.5; }
  .board-center-content{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width: 94%; max-height: 90%;
    overflow-y: auto;
    text-align:left;
    z-index: 6;
  }
  .board-center-content::-webkit-scrollbar{ width:5px; }
  .board-center-content::-webkit-scrollbar-thumb{ background: rgba(244,238,221,0.25); border-radius:3px; }
  .token{
    position:absolute; width:22px; height:22px; border-radius:50%;
    border:2.5px solid #fff; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#0D1730;
    box-shadow:0 2px 6px rgba(0,0,0,0.5);
    transition: left .16s linear, top .16s linear;
    z-index: 5;
  }

  .nt-payday{ fill: var(--cream); }
  .nt-opportunity{ fill: var(--gold); }
  .nt-market{ fill: #9C86D6; }
  .nt-expense{ fill: #FF8A75; }
  .nt-family{ fill: #F2A6C6; }
  .nt-jobloss{ fill: #E24B36; }
  .nt-charity{ fill: var(--mint); }

  /* ---------- action zone (roll prompt / dice / cards), now docked in board center ---------- */
  .panel{
    border-radius:16px; padding:16px 14px; text-align:center;
    background: linear-gradient(160deg, rgba(20,33,61,0.92), rgba(20,33,61,0.88));
    border: 1.5px solid rgba(244,238,221,0.18);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .panel .turn-title{ font-size:16px; font-weight:800; margin-bottom:5px; }
  .panel .turn-sub{ font-size:11.5px; opacity:0.6; margin-bottom:14px; line-height:1.5; }
  .dice-row{ display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .die{
    width:38px; height:38px; border-radius:9px; background:var(--cream); color:var(--navy-deep);
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .btn{ appearance:none; border:none; cursor:pointer; font:inherit; font-weight:800; font-size:14.5px; padding:12px 26px; border-radius:999px; }
  .btn:active{ transform: translateY(2px) scale(0.98); }
  .btn-gold{ background: linear-gradient(180deg, var(--gold), var(--gold-deep)); color: var(--navy-deep); box-shadow: 0 10px 24px -8px rgba(242,183,5,0.55), inset 0 -3px 0 rgba(0,0,0,0.15); }
  .btn-ghost{ border:1.5px solid rgba(244,238,221,0.3); background:rgba(244,238,221,0.06); color:var(--cream); font-weight:700; font-size:13px; padding:10px 20px; }

  /* content card (reused styling) */
  .card{
    border-radius:16px; padding: 13px; text-align:left;
    background: linear-gradient(160deg, rgba(20,33,61,1), rgba(13,23,48,1));
    border: 1.5px solid rgba(244,238,221,0.18);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .cat-row{ display:flex; align-items:center; gap:9px; margin-bottom:11px; }
  .cat-icon{ width:28px; height:28px; flex:none; }
  .cat-name{ font-size:13.5px; font-weight:800; }
  .scope-pill{ margin-left:auto; font-size:10px; padding:3px 9px; border-radius:999px; background:rgba(244,238,221,0.12); border:1px solid rgba(244,238,221,0.2); white-space:nowrap; }
  .body-text{ font-size:15.5px; line-height:1.5; font-weight:600; }
  .deal-note{ margin-top:10px; font-size:12px; line-height:1.55; padding:9px 11px; border-radius:10px; background:rgba(79,184,148,0.14); border:1px solid rgba(79,184,148,0.35); opacity:0.92; }
  .insurance-note{ margin-top:10px; font-size:15px; font-weight:800; line-height:1.5; padding:11px 13px; border-radius:10px; background:rgba(79,184,148,0.22); border:1.5px solid rgba(79,184,148,0.55); color:#DFF7EC; }
  .insurance-note b{ font-size:17px; color:#7BEFC4; }
  .foot-row{ display:flex; justify-content:flex-end; margin-top:14px; gap:8px; }

  .card.opportunity{ border-color: rgba(242,183,5,0.45); }
  .card.market{ border-color: rgba(107,91,149,0.55); }
  .card.expense{ border-color: rgba(232,93,76,0.5); }
  .card.family{ border-color: rgba(242,166,198,0.55); }
  .card.jobloss{ border-color: rgba(255,138,117,0.6); }
  .card.charity{ border-color: rgba(79,184,148,0.5); }
  .card.payday{ border-color: rgba(242,183,5,0.6); }

  .card.opportunity .cat-name{ color: var(--gold); }
  .card.market .cat-name{ color:#C6B8F0; }
  .card.expense .cat-name{ color:#FFAF9F; }
  .card.family .cat-name{ color:#F2A6C6; }
  .card.jobloss .cat-name{ color:#FF8A75; }
  .card.charity .cat-name{ color: var(--mint); }
  .card.payday .cat-name{ color: var(--gold); }

  .asset-list{ display:flex; flex-direction:column; gap:6px; margin-top:5px; }
  .asset-row{ padding:8px 10px; border-radius:10px; background:rgba(244,238,221,0.06); border:1px solid rgba(244,238,221,0.14); font-size:11.5px; }
  .asset-row-main{ display:flex; align-items:center; gap:6px; }
  .asset-row .a-name{ font-weight:800; flex:1.3; }
  .asset-row .a-cost{ flex:1; opacity:0.85; }
  .asset-row .a-income{ flex:1; color:var(--mint); font-weight:700; text-align:right; }
  .buy-btn{
    appearance:none; border:none; cursor:pointer; flex:none;
    background: var(--mint); color:#0D1730; font:inherit; font-weight:800; font-size:11px;
    padding:6px 12px; border-radius:999px;
  }
  .buy-btn:active{ transform: scale(0.94); }
  .buy-btn[disabled]{ cursor:not-allowed; }
  .buy-btn.btn-armed{ background: var(--coral); color:#fff; padding:6px 14px; animation: armPulse 1s ease-in-out infinite; }
  .buy-btn.btn-locked{ opacity:0.3; }
  @keyframes armPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(232,93,76,0.55);} 50%{ box-shadow:0 0 0 6px rgba(232,93,76,0);} }
  .btn.btn-armed{ background: var(--coral); border-color:var(--coral); animation: armPulse 1s ease-in-out infinite; }
  .keypad-wrap{ margin-top:10px; }
  .keypad-display{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; font-size:13px; }
  .keypad-display .kd-label{ opacity:0.7; }
  .keypad-display .kd-qty{ font-size:20px; font-weight:800; color:var(--gold); }
  .keypad-display .kd-total{ font-size:12.5px; opacity:0.85; }
  .keypad-display .kd-total b{ color:var(--gold); font-size:14px; }
  .keypad-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; max-width:220px; }
  .keypad-btn{
    appearance:none; border:2px solid rgba(244,238,221,0.4); background:rgba(244,238,221,0.16);
    color:var(--cream); font:inherit; font-size:16px; font-weight:800; padding:10px 0; border-radius:9px; cursor:pointer;
  }
  .keypad-btn:active{ transform:scale(0.94); background:rgba(244,238,221,0.28); }
  .keypad-btn.kp-wide{ font-size:12px; }
  .trade-cols{ display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .trade-col{ flex:1 1 200px; min-width:180px; }
  .trade-col-title{ font-size:12px; font-weight:800; opacity:0.7; margin-bottom:4px; }
  .a-unlock{ margin-top:5px; font-size:10.5px; opacity:0.7; line-height:1.45; }
  .asset-hint{ font-size:11px; opacity:0.55; margin-top:10px; line-height:1.55; }

  .prof-stats{ display:flex; flex-direction:column; gap:7px; margin-top:4px; }
  .prof-stat-row{ display:flex; justify-content:space-between; align-items:baseline; padding:9px 12px; border-radius:10px; background:rgba(244,238,221,0.06); border:1px solid rgba(244,238,221,0.14); }
  .prof-stat-row .lbl{ font-size:11.5px; opacity:0.7; }
  .prof-stat-row .val{ font-size:15px; font-weight:800; }
  .prof-stat-row.balance .val{ color:var(--gold); }

  .quiz{ margin-top:10px; }
  .quiz-q{ font-size:12px; opacity:0.85; margin-bottom:8px; }
  .quiz-opts{ display:flex; flex-direction:column; gap:6px; }
  .quiz-opt{ appearance:none; text-align:left; cursor:pointer; font:inherit; font-size:11.5px; padding:7px 11px; border-radius:10px; border:1.5px solid rgba(244,238,221,0.25); background:rgba(244,238,221,0.05); color:var(--cream); }
  .quiz-opt.correct{ border-color:#8CD48A; background:rgba(140,212,138,0.18); }
  .quiz-opt.wrong{ border-color:var(--coral); background:rgba(232,93,76,0.18); }
  .quiz-explain{ margin-top:8px; font-size:11px; opacity:0.75; line-height:1.45; }

  /* ---------- intro screen: cinematic title hero ---------- */
  #introScreen{ width:100%; max-width:640px; text-align:center; }
  .intro-hero{
    position:relative; width:100%; border-radius:18px; overflow:hidden;
    box-shadow: 0 20px 55px rgba(0,0,0,0.5), 0 0 0 1px rgba(242,183,5,0.18);
    background:#0a0f1f; margin-bottom:16px;
  }
  .intro-hero-imgwrap{ position:relative; width:100%; padding-top:53.94%; overflow:hidden; }
  .intro-hero-img{
    position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;
    object-position: center top; display:block; transform-origin:center center;
    animation: introKenburns 16s ease-in-out infinite alternate;
  }
  @keyframes introKenburns{ from{ transform:scale(1);} to{ transform:scale(1.09);} }
  .intro-lightning{
    position:absolute; inset:0; pointer-events:none; opacity:0; mix-blend-mode:screen;
  }
  .intro-lightning.bolt1{
    background: radial-gradient(circle at 20% 45%, rgba(255,255,255,0.95), rgba(200,220,255,0.35) 30%, rgba(255,255,255,0) 55%);
    animation: introFlash1 7.5s ease-out infinite;
  }
  .intro-lightning.bolt2{
    background: radial-gradient(circle at 28% 70%, rgba(220,232,255,0.85), rgba(255,255,255,0) 45%);
    animation: introFlash2 11s ease-out infinite;
  }
  @keyframes introFlash1{
    0%, 55%, 100%{ opacity:0; }
    55.3%{ opacity:0.9; }
    55.6%{ opacity:0.15; }
    56.1%{ opacity:0.75; }
    56.6%{ opacity:0; }
  }
  @keyframes introFlash2{
    0%, 30%, 100%{ opacity:0; }
    30.4%{ opacity:0.7; }
    30.9%{ opacity:0; }
    31.3%{ opacity:0.5; }
    31.8%{ opacity:0; }
  }
  .intro-panel{
    background: rgba(244,238,221,0.06); border:1.5px solid rgba(244,238,221,0.16);
    border-radius:16px; padding:20px 22px 22px; text-align:left;
  }
  .intro-desc{ font-size:13.5px; opacity:0.68; line-height:1.7; margin:16px 2px 0; text-align:center; }
  .field-row{ text-align:left; margin-bottom:16px; }
  .field-label{ font-size:13px; opacity:0.65; margin-bottom:8px; }
  .text-input{ width:100%; background:rgba(244,238,221,0.08); border:1.5px solid rgba(244,238,221,0.25); border-radius:10px; color:var(--cream); font:inherit; font-size:16px; padding:12px 14px; outline:none; }
  .text-input:focus{ border-color:var(--gold); }
  .size-picker{ display:flex; gap:10px; }
  .size-opt{ flex:1; text-align:center; padding:12px 0; border-radius:10px; border:1.5px solid rgba(244,238,221,0.22); background:rgba(244,238,221,0.05); font-size:16px; font-weight:700; cursor:pointer; }
  .size-opt.active{ background:rgba(242,183,5,0.18); border-color:var(--gold); color:var(--gold); }
  .solo-opt{
    margin-top:10px; text-align:center; padding:11px 0; border-radius:10px;
    border:1.5px dashed rgba(244,238,221,0.3); background:rgba(244,238,221,0.04);
    font-size:13.5px; font-weight:700; cursor:pointer; opacity:0.85; transition: all .15s;
  }
  .solo-opt.active{ background:rgba(242,183,5,0.18); border-color:var(--gold); border-style:solid; color:var(--gold); opacity:1; }

  .prof-card{ text-align:center; }
  .prof-card .big-icon{ width:78px; height:78px; margin-bottom:16px; animation: float 4.5s ease-in-out infinite; }
  @keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  .prof-name{ font-size:28px; font-weight:900; margin-bottom:16px; }

  .reset-link{ margin-top:20px; background:none; border:none; color:var(--cream); opacity:0.4; font:inherit; font-size:12px; cursor:pointer; text-decoration:underline; }
  .reset-link:active{ opacity:0.7; }
  .hidden{ display:none !important; }

  /* ---------- rules button + modal ---------- */
  .rules-btn{
    appearance:none; cursor:pointer; font:inherit; flex:none; white-space:nowrap;
    border:1.5px solid rgba(244,238,221,0.28); background:rgba(244,238,221,0.07); color:var(--cream);
    font-weight:700; font-size:12px; padding:7px 14px; border-radius:999px;
  }
  .rules-btn:active{ transform: scale(0.96); }
  .rules-btn-intro{ font-size:12.5px; padding:9px 20px; opacity:0.85; }
  .rules-btn.disabled, .rules-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .modal-overlay{
    position:fixed; inset:0; z-index:200; background:rgba(6,10,22,0.72);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background: linear-gradient(160deg, rgba(21,34,63,0.99), rgba(13,23,48,0.99));
    border:1.5px solid rgba(244,238,221,0.22); border-radius:18px;
    max-width:540px; width:100%; max-height:86vh; overflow-y:auto;
    padding:20px 20px 18px; box-shadow:0 40px 90px -20px rgba(0,0,0,0.7);
    text-align:left;
  }
  .modal-box::-webkit-scrollbar{ width:5px; }
  .modal-box::-webkit-scrollbar-thumb{ background: rgba(244,238,221,0.25); border-radius:3px; }
  .modal-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .modal-title{ font-size:18px; font-weight:800; }
  .modal-close{
    appearance:none; border:none; cursor:pointer; flex:none;
    background:rgba(244,238,221,0.1); color:var(--cream); width:30px; height:30px;
    border-radius:50%; font-size:15px; line-height:1;
  }
  .modal-close:active{ transform: scale(0.92); }
  .rules-section{ margin-bottom:17px; }
  .rules-section:last-child{ margin-bottom:2px; }
  .rules-h{ font-size:12.5px; font-weight:800; color:var(--gold); margin-bottom:7px; letter-spacing:0.02em; }
  .rules-p{ font-size:13px; line-height:1.7; opacity:0.92; }
  .rules-badge-row{ display:flex; align-items:flex-start; gap:9px; padding:8px 0; border-top:1px solid rgba(244,238,221,0.1); }
  .rules-badge-row:first-child{ border-top:none; padding-top:2px; }
  .rules-badge-icon{ font-size:19px; flex:none; line-height:1.3; }
  .rules-badge-label{ font-weight:800; font-size:13px; }
  .rules-badge-desc{ font-size:12px; opacity:0.75; margin-top:2px; line-height:1.5; }
  .rules-cell-row{ display:flex; align-items:center; gap:10px; padding:5px 0; }
  .rules-cell-icon{ font-size:16px; flex:none; width:22px; text-align:center; }
  .rules-cell-label{ font-weight:800; font-size:12.5px; flex:none; width:64px; }
  .rules-cell-desc{ font-size:12px; opacity:0.82; line-height:1.5; }

  @media (max-width:420px){
    .headline h1{ font-size:19px; }
    .body-text{ font-size:17px; }
    .board-wrap{ width: 340px; height:340px; max-width:88vw; max-height:88vw; }
    .intro-panel{ padding:16px 16px 18px; }
  }
  @media (max-width:480px){
    .game-layout{ flex-direction:column; align-items:center; }
    .board-center-wrap{ order:-1; margin-bottom:6px; }
    .side-players{ width:100%; max-width:520px; flex-direction:column; gap:8px; }
    .side-players .player-box{ width:100%; padding:10px 14px; }
    .player-box .pb-name{ margin-bottom:0; cursor:pointer; }
    .pb-chevron{ display:inline-block; }
    .player-box.collapsed .pb-chevron{ transform:rotate(-90deg); }
    .player-box.collapsed .pb-body{ display:none; }
    .player-box.collapsed .pb-quick{ display:flex; gap:16px; font-size:13px; margin-top:6px; opacity:0.9; }
    .player-box .pb-quick .v-gold{ color:var(--gold); font-weight:700; }
    .player-box .pb-quick .v-mint{ color:var(--mint); font-weight:700; }
    .player-box .pb-body{ margin-top:8px; }
  }
</style>
</head>

  // Wires up a keypad's buttons; calls onChange(qty) whenever the number changes. maxVal optional cap.
  function wireKeypad(idPrefix, onChange, maxVal){
    var qtyStr = '';
    var qtyEl = document.getElementById(idPrefix+'Qty');
    function update(){
      var n = parseInt(qtyStr, 10);
      if(isNaN(n)) n = 0;
      if(maxVal != null && n > maxVal){ n = maxVal; qtyStr = String(n); }
      qtyEl.textContent = qtyStr === '' ? '0' : qtyStr;
      onChange(n);
    }
    var btns = document.querySelectorAll('[data-kp="'+idPrefix+'"]');
    for(var i=0; i<btns.length; i++){
      (function(btn){
        btn.addEventListener('click', function(){
          var k = btn.getAttribute('data-k');
          if(k === 'clear'){ qtyStr = ''; }
          else if(k === 'back'){ qtyStr = qtyStr.slice(0, -1); }
          else {
            if(qtyStr === '0') qtyStr = k;
            else if(qtyStr.length < 4) qtyStr += k;
          }
          update();
        });
      })(btns[i]);
    }
    update();
  }

  var actx = null;
  function ctx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function tone(freq,start,dur,type,gainVal){
    var c=ctx(); if(!c) return;
    var osc=c.createOscillator(); var gain=c.createGain();
    osc.type=type||'sine';
    osc.frequency.setValueAtTime(freq, c.currentTime+start);
    gain.gain.setValueAtTime(0, c.currentTime+start);
    gain.gain.linearRampToValueAtTime(gainVal||0.18, c.currentTime+start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime+start+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(c.currentTime+start); osc.stop(c.currentTime+start+dur+0.05);
  }

  function drawProfessionFromBag(){
    if(professionBag.length === 0){
      professionBag = PROFESSIONS.slice();
      // Fisher-Yates shuffle
      for(var i=professionBag.length-1; i>0; i--){
        var j = Math.floor(Math.random()*(i+1));
        var tmp = professionBag[i]; professionBag[i] = professionBag[j]; professionBag[j] = tmp;
      }
    }
    return professionBag.pop();
  }

  // ================= confirm-before-buy (prevents accidental double taps) =================
  function wireBuyConfirm(btn, confirmLabel, lockGroup, onConfirm){
    var armed = false;
    var timer = null;
    function lockOthers(lock){
      for(var i=0; i<lockGroup.length; i++){
        var other = lockGroup[i];
        if(other === btn) continue;
        if(lock){ other.disabled = true; other.classList.add('btn-locked'); }
        else if(!other.hasAttribute('data-perm-disabled')){ other.disabled = false; other.classList.remove('btn-locked'); }
      }
    }
    function disarm(){
      if(timer){ clearTimeout(timer); timer = null; }
      armed = false;
      btn.textContent = btn.getAttribute('data-orig-label');
      btn.classList.remove('btn-armed');
      lockOthers(false);
    }
    btn.addEventListener('click', function(){
      if(armed){
        disarm();
        onConfirm();
        return;
      }
      btn.setAttribute('data-orig-label', btn.textContent);
      btn.textContent = confirmLabel;
      btn.classList.add('btn-armed');
      armed = true;
      lockOthers(true);
      timer = setTimeout(disarm, 3200);
    });
  }

  // ================= computer player (bot) logic =================
  function isBot(i){ return !!isComputer[i]; }
  var BOT_STEP_DELAY = 1300; // ms between each bot auto-play step, so the class can watch it happen
  var BOT_BANKRUPT_SELL_DELAY = 260; // faster pacing when a bot has to sell off many small assets one by one during bankruptcy
  var botTurnLog = []; // actions the current bot took this turn, shown in the end-of-turn recap card
  function logBotAction(line){ botTurnLog.push(line); }
  function botDelay(fn, ms){ setTimeout(fn, ms || BOT_STEP_DELAY); }
  function once(fn){
    var done = false;
    return function(){
      if(done) return;
      done = true;
      return fn.apply(null, arguments);
    };
  }
  var BOT_CASH_BUFFER = 3000; // bots always keep at least this much cash in reserve

  function botAffordableAssets(idx){
    return ASSETS.filter(function(a){ return !a.unlock && (cash[idx] - a.cost) >= BOT_CASH_BUFFER; });
  }
  function botPickBestAsset(idx){
    var options = botAffordableAssets(idx);
    if(options.length === 0) return null;
    options.sort(function(x,y){
      var rx = x.cost > 0 ? x.income/x.cost : x.income;
      var ry = y.cost > 0 ? y.income/y.cost : y.income;
      return ry - rx;
    });
    return options[0];
  }
  function botPickInsurance(idx){
    var owned = ownedInsurance[idx] || [];
    if(owned.some(function(p){ return p.category === 'all'; })) return null;
    var haveCat = {};
    for(var k=0; k<owned.length; k++){ haveCat[owned[k].category] = true; }
    var options = INSURANCE.filter(function(ins){
      if(ins.category !== 'all' && haveCat[ins.category]) return false;
      return (cash[idx] - ins.cost) >= BOT_CASH_BUFFER;
    });
    if(options.length === 0) return null;
    var allPolicy = options.filter(function(o){ return o.category === 'all'; })[0];
    if(allPolicy && cash[idx] >= allPolicy.cost + BOT_CASH_BUFFER * 2) return allPolicy;
    var singles = options.filter(function(o){ return o.category !== 'all'; });
    singles.sort(function(x,y){ return x.cost - y.cost; });
    return singles[0] || null;
  }
  function botDecideOpportunity(item){
    var idx = turnIndex;
    if(item.kind === 'assetmenu'){
      var asset = botPickBestAsset(idx);
      if(asset){
        buyAsset(idx, asset.name, asset.cost, asset.income);
        logBotAction('🛒 買了「' + asset.name + '」（NT$' + fmt(asset.cost) + '，被動收入 +' + fmt(asset.income) + '／輪）');
      }
      var ins = botPickInsurance(idx);
      if(ins){
        cash[idx] -= ins.cost;
        ownedInsurance[idx].push({ name:ins.name, category:ins.category, usesLeft:ins.uses, discount:ins.discount });
        logBotAction('🛡️ 投保了「' + ins.name + '」（NT$' + fmt(ins.cost) + '）');
      }
      refreshStats();
    } else if(item.kind === 'assetcard'){
      var c = item.card;
      if((cash[idx] - c.cost) >= BOT_CASH_BUFFER){
        buyAsset(idx, c.assetType, c.cost, c.income);
        logBotAction('🛒 買了「' + c.label + '」（' + c.assetType + '，NT$' + fmt(c.cost) + '，被動收入 +' + fmt(c.income) + '／輪）');
        refreshStats();
      }
    } else if(item.kind === 'discount'){
      if((cash[idx] - item.buyCost) >= BOT_CASH_BUFFER){
        buyAsset(idx, item.buyName, item.buyCost, item.buyIncome);
        logBotAction('🛒 用折扣價買了「' + item.buyName + '」（NT$' + fmt(item.buyCost) + '，被動收入 +' + fmt(item.buyIncome) + '／輪）');
        refreshStats();
      }
    } else if(item.kind === 'stock'){
      var stk = STOCKS[item.stock];
      if(stk.dividend > 0){
        var spendable = Math.max(0, cash[idx] - BOT_CASH_BUFFER) * 0.3;
        var qty = Math.min(20, Math.floor(spendable / item.price));
        for(var q=0; q<qty; q++){ buyAsset(idx, stk.name, item.price, stk.dividend); }
        if(qty > 0){
          logBotAction('📈 買進「' + stk.name + '」' + qty + ' 股（NT$' + fmt(item.price*qty) + '）');
          refreshStats();
        }
      }
    }
    if(item.quiz){
      var already = ownedAssets[idx].some(function(a){ return a.name === '技能副業'; });
      if(!already){
        buyAsset(idx, '技能副業', 0, 450);
        logBotAction('✅ 答對小知識，解鎖了「技能副業」（被動收入 +450／輪）');
        refreshStats();
      }
    }
  }
  function botDecideCharity(donateAmt){
    return (cash[turnIndex] - donateAmt) >= BOT_CASH_BUFFER * 1.5;
  }

  var VB = 400, VBC = 200, R_OUT = 188, R_IN = 122, R_TOKEN = 155, SEG = 360/24;

  function polarXY(angleDeg, radius){
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: VBC + radius*Math.cos(rad), y: VBC + radius*Math.sin(rad) };
  }

  function describeWedge(startAngle, endAngle){
    var so = polarXY(endAngle, R_OUT);
    var eo = polarXY(startAngle, R_OUT);
    var si = polarXY(endAngle, R_IN);
    var ei = polarXY(startAngle, R_IN);
    var largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
    return ['M', so.x, so.y,
      'A', R_OUT, R_OUT, 0, largeArc, 0, eo.x, eo.y,
      'L', ei.x, ei.y,
      'A', R_IN, R_IN, 0, largeArc, 1, si.x, si.y,
      'Z'].join(' ');
  }

  function tokenPercentXY(boardIndex, playerIdx){
    var centerAngle = boardIndex*SEG + SEG/2;
    var tp = polarXY(centerAngle, R_TOKEN);
    var jitter = groupSize>1 ? (playerIdx - (groupSize-1)/2) * 6 : 0;
    return { leftPct: (tp.x+jitter)/VB*100, topPct: (tp.y+jitter)/VB*100 };
  }

  function renderBoardDOM(){
    var wrap = document.getElementById('boardWrap');
    var tokensLayer;
    if(!wrap){
      var svgPaths = '';
      var iconsSvg = '';
      var iconSize = 26, iconScale = iconSize/40;
      for(var i=0;i<24;i++){
        var t = BOARD[i];
        svgPaths += '<path class="board-cell nt-'+t+'" d="'+describeWedge(i*SEG,(i+1)*SEG)+'"></path>';
        var ic = polarXY(i*SEG + SEG/2, R_TOKEN);
        if(t === 'charity'){
          var half = iconSize/2;
          iconsSvg += '<image x="'+(ic.x-half)+'" y="'+(ic.y-half)+'" width="'+iconSize+'" height="'+iconSize+'" href="'+CHARITY_ICON_B64+'" xlink:href="'+CHARITY_ICON_B64+'" opacity="0.92"></image>';
        } else {
          iconsSvg += '<g transform="translate('+ic.x+','+ic.y+') scale('+iconScale+') translate(-20,-20)" opacity="0.92">' + BOARD_ICON_FRAGMENTS[t] + '</g>';
        }
      }
      boardArea.innerHTML = '<div class="board-wrap" id="boardWrap">' +
        '<svg class="board-svg" viewBox="0 0 '+VB+' '+VB+'" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">' + svgPaths + iconsSvg + '</svg>' +
        '<div id="tokensLayer" style="position:absolute; top:0; left:0; right:0; bottom:0;"></div>' +
        '<div class="board-center-content" id="centerContent"></div>' +
      '</div>';
      wrap = document.getElementById('boardWrap');
      actionZone = document.getElementById('centerContent'); // rebind once; persists across re-renders
    }
    tokensLayer = document.getElementById('tokensLayer');
    var tokensHTML = '';
    for(var pIdx=0; pIdx<groupSize; pIdx++){
      var pos = tokenPercentXY(tokenPos[pIdx], pIdx);
      tokensHTML += '<div class="token" id="token-'+pIdx+'" style="left:'+pos.leftPct+'%; top:'+pos.topPct+'%; background:'+TOKEN_COLORS[pIdx]+';">'+(pIdx+1)+'</div>';
    }
    tokensLayer.innerHTML = tokensHTML;
  }

  function moveTokenDOM(pIdx, newIndex){
    var el = document.getElementById('token-'+pIdx);
    if(!el) return;
    var pos = tokenPercentXY(newIndex, pIdx);
    el.style.left = pos.leftPct + '%';
    el.style.top = pos.topPct + '%';
  }

  function startTurn(){
    pbOpen = {}; pbOpen[turnIndex] = true;
    botTurnLog = [];
    renderBoardDOM();
    refreshStats();
    if(gameEnded){ renderSettlementScreen(); return; }
    if(eliminated.length && eliminated.every(function(e){return e;})){
      phaseLabel.innerHTML = '遊戲結束';
      headlineText.innerHTML = '😢 全組都出局了';
      var el = document.createElement('div');
      el.className = 'panel';
      el.innerHTML = '<div class="turn-title">這組所有玩家都破產出局了</div><div class="turn-sub">可以看看紙本記錄，討論一下哪個決定是轉捩點</div>';
      actionZone.innerHTML = '';
      actionZone.appendChild(el);
      return;
    }
    if(jobRest[turnIndex] > 0){
      jobRest[turnIndex] -= 1;
      renderRestNotice();
      return;
    }
    turnsTaken[turnIndex] = (turnsTaken[turnIndex] || 0) + 1;
    var p = players[turnIndex];
    var bot = isBot(turnIndex);
    var diceCount = charityLeft[turnIndex] > 0 ? 2 : 1;
    phaseLabel.innerHTML = '第 <b>' + (turnIndex+1) + '</b> 位玩家的回合' + (bot ? '（電腦）' : '');
    headlineText.innerHTML = (turnIndex+1) + '號・<span>' + p.name + '</span>' + (bot ? ' 🤖' : '');
    var el = document.createElement('div');
    el.className = 'panel';
    var bonusNote = diceCount===2 ? '<div class="asset-hint">🎗 慈善加碼中：這輪擲 2 顆骰子！</div>' : '';
    el.innerHTML =
      '<div class="turn-title">輪到第 ' + (turnIndex+1) + ' 位玩家' + (bot ? '（電腦）' : '') + '</div>' +
      '<div class="turn-sub">' + (bot ? '電腦正在擲骰子…' : '按下去擲骰子，token 會往前走') + '</div>' +
      bonusNote +
      '<div style="margin-top:14px;"><button class="btn btn-gold">🎲 擲骰子</button></div>';
    actionZone.innerHTML = '';
    actionZone.appendChild(el);
    var roll = once(function(){ onRoll(diceCount); });
    el.querySelector('button').addEventListener('click', roll);
    if(bot){ botDelay(roll); }
  }

  function renderRestNotice(){
    var p = players[turnIndex];
    var bot = isBot(turnIndex);
    phaseLabel.innerHTML = '休息中・第 <b>' + (turnIndex+1) + '</b> 位玩家';
    headlineText.innerHTML = '😮 這輪先休息';
    var el = document.createElement('div');
    el.className = 'card jobloss';
    el.innerHTML =
      '<div class="cat-row"><div class="cat-icon">'+ICONS.jobloss+'</div><div class="cat-name">第 ' + (turnIndex+1) + ' 位玩家・' + p.name + (bot ? ' 🤖' : '') + '</div></div>' +
      '<div class="body-text" style="font-size:16px;">因為之前抽到「失業」，這位玩家還要休息一輪，不能擲骰子。</div>' +
      '<div class="foot-row"><button class="btn btn-ghost">好，換下一位</button></div>';
    actionZone.innerHTML = '';
    actionZone.appendChild(el);
    var proceed = once(goToNextPlayer);
    el.querySelector('button').addEventListener('click', proceed);
    if(bot){ botDelay(proceed); }
  }

  function onRoll(diceCount){
    var rolls = [];
    for(var i=0;i<diceCount;i++){ rolls.push(rollDie()); }
    if(diceCount===2){ charityLeft[turnIndex] -= 1; }
    var steps = rolls.reduce(function(a,b){return a+b;},0);

    var from = tokenPos[turnIndex];
    var landingPos = (from + steps) % 24;
    var skippedJobloss = false;
    if(BOARD[landingPos] === 'jobloss' && turnsTaken[turnIndex] <= GRACE_TURNS){
      steps += 1; // 新手保護期：多走一步，避開失業格
      skippedJobloss = true;
    }

    var el = document.createElement('div');
    el.className = 'panel';
    var skipNote = skippedJobloss ? '<div class="asset-hint">🛡️ 新手保護期：前面剛好是失業格，自動多走一步避開！</div>' : '';
    el.innerHTML = '<div class="turn-title">擲出來了！</div>' +
      '<div class="dice-row">' + rolls.map(function(r){return '<div class="die">'+r+'</div>';}).join('') + '</div>' +
      '<div class="turn-sub">總共 ' + rolls.reduce(function(a,b){return a+b;},0) + ' 步，token 出發嘍……</div>' +
      skipNote;
    actionZone.innerHTML = '';
    actionZone.appendChild(el);
    playSound('step');

    var path = [];
    for(var k=1;k<=steps;k++){ path.push((from+k) % 24); }

    var stepI = 0;
    function stepAnim(){
      if(stepI < path.length){
        tokenPos[turnIndex] = path[stepI];
        moveTokenDOM(turnIndex, path[stepI]);
        playSound('step');
        stepI++;
        setTimeout(stepAnim, 170);
      } else {
        setTimeout(finishMove, 200);
      }
    }
    setTimeout(stepAnim, 250);

    function finishMove(){
      var finalPos = path[path.length-1];
      var paydayHits = 0;
      for(var m=0;m<path.length;m++){ if(BOARD[path[m]] === 'payday') paydayHits++; }
      var finalType = BOARD[finalPos];
      if(finalType === 'payday'){
        showPaydayCard(goToNextPlayer);
      } else if(paydayHits > 0){
        showPaydayCard(function(){ resolveLanding(finalType); });
      } else {
        resolveLanding(finalType);
      }
    }
  }

  var BOT_SUMMARY_DELAY = 5000; // how long the bot end-of-turn recap stays up before auto-advancing
  function goToNextPlayer(){
    if(gameEnded){ renderSettlementScreen(); return; }
    if(isBot(turnIndex) && botTurnLog.length > 0){
      showBotTurnSummary(botTurnLog.slice());
      return;
    }
    advanceToNextPlayer();
  }
  function showBotTurnSummary(log){
    var p = players[turnIndex];
    phaseLabel.innerHTML = '回合結算・第 <b>' + (turnIndex+1) + '</b> 位玩家（電腦）';
    headlineText.innerHTML = '🤖 ' + p.name + ' 這回合做了這些事';
    var el = document.createElement('div');
    el.className = 'panel';
    el.innerHTML =
      '<div class="turn-title">🤖 第 ' + (turnIndex+1) + ' 位玩家（電腦）回合結算</div>' +
      '<ul class="bot-summary-list">' + log.map(function(line){ return '<li>' + line + '</li>'; }).join('') + '</ul>' +
      '<div class="turn-sub" style="margin-top:10px;">⏱️ 5 秒後自動換下一位…</div>';
    actionZone.innerHTML = '';
    actionZone.appendChild(el);
    setTimeout(advanceToNextPlayer, BOT_SUMMARY_DELAY);
  }
  function advanceToNextPlayer(){
    var attempts = 0;
    var oldIndex = turnIndex;
    do{
      turnIndex = (turnIndex + 1) % groupSize;
      attempts++;
    } while(eliminated[turnIndex] && attempts <= groupSize);
    if(turnIndex <= oldIndex){
      roundNumber++;
      updateRoundLabel();
      if(pendingSettleRoundsLeft != null){
        pendingSettleRoundsLeft--;
        if(pendingSettleRoundsLeft <= 0){
          pendingSettleRoundsLeft = null;
          updateSettleCountdownLabel();
          if(!gameEnded){ gameEnded = { manual:true }; }
        } else {
          updateSettleCountdownLabel();
        }
      }
    }
    startTurn();
  }

  // ---------- landing resolvers ----------
  function resolveLanding(type){
    playSound(type);
    if(type === 'opportunity'){
      var oppItem = pick(OPPORTUNITY_POOL);
      if(oppItem.kind === 'assetcard'){ oppItem = { kind:'assetcard', text:oppItem.text, card:drawAssetCard() }; }
      renderOpportunity(oppItem);
    }
    else if(type === 'market'){ renderMarket(pick(MARKET_POOL)); }
    else if(type === 'expense'){ renderExpense(pick(EXPENSE_POOL)); }
    else if(type === 'family'){ renderFamily(pick(FAMILY_POOL)); }
    else if(type === 'jobloss'){ renderJobloss(); }
    else if(type === 'charity'){ renderCharity(pick(CHARITY_POOL)); }
  }

  // ---------- bankruptcy (matches original: sell assets at half price, pause 3 rounds if recovered, else eliminated) ----------
  function startBankruptcyFlow(afterFn){
    phaseLabel.innerHTML = '⚠️ 破產警報';
    headlineText.innerHTML = '⚠️ <span>現金變負的了</span>';
    playSound('jobloss');
    var el = document.createElement('div');
    el.className = 'card jobloss';
    el.innerHTML =
      '<div class="cat-row"><div class="cat-icon">'+ICONS.jobloss+'</div><div class="cat-name">第 ' + (turnIndex+1) + ' 位玩家破產了</div></div>' +
      '<div class="body-text" style="font-size:15px;">現金變負的，要賣資產換錢。每項資產用「買入成本的一半」賣回給銀行，賣到現金轉正為止。</div>' +
      '<div id="bankruptAssetBox"></div>' +
      '<div class="foot-row" id="bankruptFootRow"></div>';
    actionZone.innerHTML = '';
    actionZone.appendChild(el);

    function renderState(){
      var box = document.getElementById('bankruptAssetBox');
      var foot = document.getElementById('bankruptFootRow');
      var owned = ownedAssets[turnIndex];
      var bot = isBot(turnIndex);
      if(cash[turnIndex] >= 0){
        box.innerHTML = '<div class="asset-hint">✅ 現金已經轉正了！這位玩家要暫停 <b style="color:var(--gold);">3 輪</b>不能擲骰子，之後就能正常回來玩。</div>';
        foot.innerHTML = '<button class="btn btn-gold">好，暫停 3 輪</button>';
        var proceedOk = once(function(){ jobRest[turnIndex] = 3; afterFn(); });
        foot.querySelector('button').addEventListener('click', proceedOk);
        if(bot){ botDelay(proceedOk); }
        return;
      }
      if(owned.length === 0){
        box.innerHTML = '<div class="asset-hint">資產都賣光了，現金還是負的：<b style="color:#FF8A75;">NT$' + fmt(cash[turnIndex]) + '</b>。這位玩家正式出局，之後的回合會自動跳過他。</div>';
        foot.innerHTML = '<button class="btn btn-ghost">了解，下一位</button>';
        var proceedOut = once(function(){ eliminated[turnIndex] = true; afterFn(); });
        foot.querySelector('button').addEventListener('click', proceedOut);
        if(bot){ botDelay(proceedOut); }
        return;
      }
      // group identical holdings (same name + same purchase price) into one row with a quantity picker
      var groups = [], groupMap = {};
      for(var oi=0; oi<owned.length; oi++){
        var oa = owned[oi];
        var gkey = oa.name + '|' + oa.cost;
        if(!groupMap[gkey]){ groupMap[gkey] = { name:oa.name, cost:oa.cost, income:oa.income, count:0 }; groups.push(groupMap[gkey]); }
        groupMap[gkey].count++;
      }
      var rows = groups.map(function(g, gi){
        var half = Math.round(g.cost / 2);
        if(g.count === 1){
          return '<div class="asset-row"><div class="asset-row-main"><span class="a-name">'+g.name+'</span><span class="a-cost">半價 NT$'+fmt(half)+'</span>' +
            '<button class="buy-btn" data-sell-single="'+gi+'">賣出</button></div></div>';
        }
        return '<div class="asset-row"><div class="asset-row-main"><span class="a-name">'+g.name+' ×'+g.count+'</span><span class="a-cost">半價 NT$'+fmt(half)+'／件</span>' +
          '<button class="buy-btn" data-sell-group="'+gi+'">賣出</button></div>' +
          '<div id="bankruptSellPad'+gi+'"></div></div>';
      }).join('');
      box.innerHTML = '<div class="asset-hint">目前現金：<b style="color:#FF8A75;">NT$' + fmt(cash[turnIndex]) + '</b></div><div class="asset-list">' + rows + '</div>';
      foot.innerHTML = '';
      function sellQty(name, cost, qty){
        var half = Math.round(cost / 2);
        for(var k=0; k<qty; k++){
          var idx = -1;
          for(var ai=0; ai<ownedAssets[turnIndex].length; ai++){
            if(ownedAssets[turnIndex][ai].name === name && ownedAssets[turnIndex][ai].cost === cost){ idx = ai; break; }
          }
          if(idx === -1) break;
          var a = ownedAssets[turnIndex].splice(idx,1)[0];
          cash[turnIndex] += half;
          passiveIncome[turnIndex] = Math.max(0, passiveIncome[turnIndex] - a.income);
        }
        refreshStats();
        renderState();
      }
      var singleBtns = box.querySelectorAll('[data-sell-single]');
      for(var si=0; si<singleBtns.length; si++){
        (function(btn){
          btn.addEventListener('click', function(){
            var g = groups[parseInt(btn.getAttribute('data-sell-single'),10)];
            sellQty(g.name, g.cost, 1);
          });
        })(singleBtns[si]);
      }
      var groupBtns = box.querySelectorAll('[data-sell-group]');
      for(var gbi=0; gbi<groupBtns.length; gbi++){
        (function(btn){
          btn.addEventListener('click', function(){
            var gi = parseInt(btn.getAttribute('data-sell-group'),10);
            var g = groups[gi];
            var half = Math.round(g.cost / 2);
            var kpId = 'bkSellKp'+gi;
            document.getElementById('bankruptSellPad'+gi).innerHTML =
              keypadHTML(kpId, '賣出數量（最多 '+g.count+'）') +
              '<div class="keypad-display" style="margin-top:6px;"><span class="kd-label">可得現金</span><span class="kd-total">NT$<b id="'+kpId+'Val">0</b></span></div>' +
              '<div style="margin-top:6px;"><button class="btn btn-gold" id="'+kpId+'Confirm" style="padding:8px 18px; font-size:12.5px;">確認賣出</button></div>';
            btn.style.display = 'none';
            var valEl = document.getElementById(kpId+'Val');
            var qty = 0;
            wireKeypad(kpId, function(n){ qty = n; valEl.textContent = fmt(half * n); }, g.count);
            document.getElementById(kpId+'Confirm').addEventListener('click', function(){
              if(qty < 1) return;
              sellQty(g.name, g.cost, qty);
            });
          });
        })(groupBtns[gbi]);
      }
      if(bot){
        // sell the weakest-earning asset first, keep the better ones as long as possible
        var worst = owned[0];
        for(var wi=1; wi<owned.length; wi++){ if(owned[wi].income < worst.income) worst = owned[wi]; }
        botDelay(once(function(){ sellQty(worst.name, worst.cost, 1); }), BOT_BANKRUPT_SELL_DELAY);
      }
    }
    renderState();
  }

        var totalCost = item.price * currentQty;
        var qtyBought = currentQty;
        sbtn.outerHTML = '<div class="asset-hint">✅ 已登記買進「' + stk2.name + '」 ' + qtyBought + ' 股！現金 −NT$' + fmt(totalCost) + (stk2.dividend>0 ? '，被動收入 +'+fmt(stk2.dividend*qtyBought)+'／輪' : '，這檔沒有股息') + '。</div>';
      });
      var sellBtnEl = document.getElementById('stockSellBtn');
      if(sellBtnEl){
        var sellQty = 0;
        var myOwnedCount = ownedAssets[turnIndex].filter(function(a){ return a.name === stk2.name; }).length;
        var sellCashEl = document.getElementById('stockSellCash');
        wireKeypad('stockSell', function(n){
          sellQty = n;
          sellCashEl.textContent = fmt(item.price * n);
        }, myOwnedCount);
        sellBtnEl.addEventListener('click', function(){
          if(sellQty < 1) return;
          for(var sk=0; sk<sellQty; sk++){
            var sidx = -1;
            for(var sai=0; sai<ownedAssets[turnIndex].length; sai++){ if(ownedAssets[turnIndex][sai].name === stk2.name){ sidx = sai; break; } }
            if(sidx === -1) break;
            var soldShare = ownedAssets[turnIndex].splice(sidx,1)[0];
            cash[turnIndex] += item.price;
            passiveIncome[turnIndex] = Math.max(0, passiveIncome[turnIndex] - soldShare.income);
          }
          refreshStats();
          var soldQty = sellQty;
          sellBtnEl.outerHTML = '<div class="asset-hint">✅ 已賣出「' + stk2.name + '」 ' + soldQty + ' 股，現金 +NT$' + fmt(item.price*soldQty) + '。</div>';
        });
      }
    }

    if(item.quiz){
      var opts = el.querySelectorAll('.quiz-opt');
      var explain = el.querySelector('.quiz-explain');
      for(var qi=0; qi<opts.length; qi++){
        (function(btn){
          btn.addEventListener('click', function(){
            if(el.getAttribute('data-answered')) return;
            el.setAttribute('data-answered','1');
            var i = parseInt(btn.getAttribute('data-i'),10);
            for(var oi=0; oi<opts.length; oi++){
              if(oi === item.quiz.correct) opts[oi].className='quiz-opt correct';
              else if(oi === i) opts[oi].className='quiz-opt wrong';
            }
            var already = ownedAssets[turnIndex].some(function(a){ return a.name === '技能副業'; });
            if(i === item.quiz.correct && !already){
              buyAsset(turnIndex, '技能副業', 0, 450);
              refreshStats();
              explain.textContent = item.quiz.explain + '（已自動登記解鎖，被動收入 +450／輪）';
            } else if(i === item.quiz.correct && already){
              explain.textContent = item.quiz.explain + '（你已經解鎖過技能副業了，這次不會重複增加）';
            } else {
              explain.textContent = item.quiz.explain;
            }
            explain.style.display = 'block';
          });
        })(opts[qi]);
      }
    } else if(item.kind === 'cash'){
      cash[turnIndex] += item.amount;
      refreshStats();
    } else if(item.kind === 'pet' || item.kind === 'dividend'){
      refreshStats();
    }
    var advance = once(goToNextPlayer);
    el.querySelector('.btn-ghost').addEventListener('click', advance);
    if(isBot(turnIndex)){
      botDecideOpportunity(item);
      botDelay(advance);
    }
  }

  function renderMarket(item){
    phaseLabel.innerHTML = '市場風雲';
    headlineText.innerHTML = '⛈️ <span>市場風雲</span>';

    if(isStockAsset(item.asset)){
      renderStockMarketEvent(item);
      return;
    }

    // volatility: apply the delta immediately to everyone currently holding this asset
    var deltaNotes = [];
    for(var pi0=0; pi0<groupSize; pi0++){
      var cnt0 = 0;
      for(var ai0=0; ai0<ownedAssets[pi0].length; ai0++){ if(ownedAssets[pi0][ai0].name === item.asset) cnt0++; }
      if(cnt0 > 0){
        var change = item.delta * cnt0;
        passiveIncome[pi0] = Math.max(0, passiveIncome[pi0] + change);
        deltaNotes.push('第 '+(pi0+1)+' 位玩家（'+cnt0+' 份，'+(change>=0?'+':'')+fmt(change)+'）');
      }
    }
    refreshStats();

    var el = document.createElement('div');
    el.className = 'card market';
    var deltaHTML = deltaNotes.length
      ? '<div class="asset-hint">📊 被動收入已自動調整：' + deltaNotes.join('　') + '</div>'
      : '<div class="asset-hint">這組目前沒有人持有這項資產，被動收入沒有變化。</div>';
    el.innerHTML =
      '<div class="cat-row"><div class="cat-icon">'+ICONS.market+'</div><div class="cat-name">市場風雲</div><div class="scope-pill">持有者的被動收入會變動</div></div>' +
      '<div class="body-text">' + item.text + '</div>' +
      deltaHTML +
      '<div class="deal-note">💰 銀行同時也開了收購價：<b>NT$' + fmt(item.buybackPrice) + '</b>／份「' + item.asset + '」，想直接出場換現金的人可以賣，不賣就繼續留著領（已調整後的）被動收入。</div>' +
      '<div id="marketOwnersBox"></div>' +
      '<div class="foot-row"><button class="btn btn-ghost">下一位</button></div>';
    actionZone.innerHTML = '';
    actionZone.appendChild(el);
    var advance = once(goToNextPlayer);
    el.querySelector('.btn-ghost').addEventListener('click', advance);
    if(isBot(turnIndex)){ botDelay(advance); }

    function renderOwnersList(){
      var box = document.getElementById('marketOwnersBox');
      var owners = [];
      for(var pi=0; pi<groupSize; pi++){
        var count = 0;
        for(var ai=0; ai<ownedAssets[pi].length; ai++){ if(ownedAssets[pi][ai].name === item.asset) count++; }
        if(count > 0){ owners.push({ pi:pi, count:count }); }
      }
      if(owners.length === 0){ box.innerHTML = ''; return; }
      var rows = owners.map(function(o){
        return '<div class="asset-row"><div class="asset-row-main">' +
          '<span class="a-name">第 ' + (o.pi+1) + ' 位玩家（持有 ' + o.count + ' 份）</span>' +
          '<button class="buy-btn" data-open-sell="'+o.pi+'">賣出</button>' +
          '</div><div id="sellPad'+o.pi+'"></div></div>';
      }).join('');
      box.innerHTML = '<div class="asset-list">' + rows + '</div>';
      var openBtns = box.querySelectorAll('[data-open-sell]');
      for(var oi=0; oi<openBtns.length; oi++){
        (function(btn){
          btn.addEventListener('click', function(){
            var pi = parseInt(btn.getAttribute('data-open-sell'),10);
            var owner = owners.filter(function(o){ return o.pi === pi; })[0];
            var kpId = 'sellKp'+pi;
            document.getElementById('sellPad'+pi).innerHTML =
              keypadHTML(kpId, '賣出份數（最多 '+owner.count+'）') +
              '<div class="keypad-display" style="margin-top:6px;"><span class="kd-label">可得現金</span><span class="kd-total">NT$<b id="'+kpId+'Cash">0</b></span></div>' +

            btn.style.display = 'none';
            var cashEl = document.getElementById(kpId+'Cash');
            var curQty = 0;
            wireKeypad(kpId, function(n){ curQty = n; cashEl.textContent = fmt(item.buybackPrice * n); }, owner.count);
            document.getElementById(kpId+'Confirm').addEventListener('click', function(){
              if(curQty < 1) return;
              for(var k=0; k<curQty; k++){
                var idx = -1;
                for(var ai=0; ai<ownedAssets[pi].length; ai++){ if(ownedAssets[pi][ai].name === item.asset){ idx = ai; break; } }
                if(idx === -1) break;
                var sold = ownedAssets[pi].splice(idx,1)[0];
                cash[pi] += item.buybackPrice;
                passiveIncome[pi] = Math.max(0, passiveIncome[pi] - sold.income);
              }
              refreshStats();
              renderOwnersList();
            });
          });
        })(openBtns[oi]);
      }

  function renderExpense(item){
    phaseLabel.innerHTML = '意外支出';
    headlineText.innerHTML = '🌧️ <span>意外支出</span>';

    // conditional cards: only trigger if the player meets the requirement
    if(item.requires === 'kids' && kidsCount[turnIndex] === 0){
      renderSkippedCondition('這張卡跟「有小孩」的家庭有關，這位玩家目前沒有小孩，這次自動跳過。');
      return;
    }
    if(item.requires === 'pet' && !hasPet[turnIndex]){
      renderSkippedCondition('這張卡跟「有寵物」的玩家有關，這位玩家目前沒有寵物，這次自動跳過。');
      return;
    }
    if(item.fraud && turnsTaken[turnIndex] <= GRACE_TURNS){
      renderSkippedCondition('🛡️ 新手保護期：這次差點被詐騙，但你還在保護期內，幸運地沒有損失！');
      return;
    }
    if(item.fraud){
      var lost = Math.max(0, cash[turnIndex]);
      cash[turnIndex] = 0;
      refreshStats();
      var elF = document.createElement('div');
      elF.className = 'card jobloss';
      elF.innerHTML =
        '<div class="cat-row"><div class="cat-icon">'+ICONS.expense+'</div><div class="cat-name">詐騙</div><div class="scope-pill">只影響你</div></div>' +
        '<div class="body-text">' + item.text + '</div>' +
        '<div class="asset-hint">😢 現金被騙光了，損失 NT$' + fmt(lost) + '（任何保險都擋不住這種損失）。以後接到類似電話，記得先打 165 反詐騙專線確認！</div>' +
        '<div class="foot-row"><button class="btn btn-ghost">了解，下一位</button></div>';
      actionZone.innerHTML = '';
      actionZone.appendChild(elF);
      var advanceF = once(goToNextPlayer);
      elF.querySelector('button').addEventListener('click', advanceF);
      if(isBot(turnIndex)){ botDelay(advanceF); }
      return;
    }

    // check for usable insurance in this category
    var usedIns = null;
    var policies = ownedInsurance[turnIndex] || [];
    for(var pi=0; pi<policies.length; pi++){
      var p = policies[pi];
      if(p.usesLeft > 0 && (p.category === item.category || p.category === 'all')){ usedIns = p; break; }
    }
    var payAmount = item.amount;
    var insNote = '';
    if(usedIns){
      var discountAmt = Math.round(item.amount * usedIns.discount);
      payAmount = item.amount - discountAmt;
      usedIns.usesLeft -= 1;
      insNote = '<div class="insurance-note">🛡️ 用「' + usedIns.name + '」理賠，折抵了 <b>NT$' + fmt(discountAmt) + '</b>！（還剩 ' + usedIns.usesLeft + ' 次）</div>';
    }
    cash[turnIndex] -= payAmount;
    refreshStats();

    var el = document.createElement('div');
    el.className = 'card expense';
    el.innerHTML =
      '<div class="cat-row"><div class="cat-icon">'+ICONS.expense+'</div><div class="cat-name">意外支出</div><div class="scope-pill">這輪要付這筆錢</div></div>' +
      '<div class="body-text">' + item.text + '</div>' +
      '<div class="asset-hint">系統已自動從現金扣掉 <b style="color:#FFAF9F;">NT$' + fmt(payAmount) + '</b>' + (usedIns ? '（原價 NT$'+fmt(item.amount)+'）' : '') + '。</div>' +
      insNote +
      '<div class="foot-row"><button class="btn btn-ghost">下一位</button></div>';
    actionZone.innerHTML = '';
    actionZone.appendChild(el);
    var advanceE = once(goToNextPlayer);
    el.querySelector('button').addEventListener('click', advanceE);
    if(isBot(turnIndex)){ botDelay(advanceE); }
  }

  function renderCharity(text){
    var p = players[turnIndex];
    var donateAmt = Math.round(p.income * 0.1);
    phaseLabel.innerHTML = '慈善';
    headlineText.innerHTML = '💚 <span>慈善</span>格';
    var el = document.createElement('div');
    el.className = 'card charity';
    el.innerHTML =
      '<div class="cat-row"><div class="cat-icon">'+ICONS.charity+'</div><div class="cat-name">慈善格</div><div class="scope-pill">可自由選擇</div></div>' +
      '<div class="body-text">' + text + '</div>' +
      '<div class="asset-hint">這輪收入的 10% 是 NT$' + fmt(donateAmt) + '。捐的話系統會自動從現金扣掉這筆，換接下來 3 輪擲 2 顆骰子。</div>' +
      '<div class="foot-row"><button class="btn btn-ghost" data-donate="0">先不要</button>' +
      '<button class="btn btn-gold" data-donate="1" style="padding:11px 22px; font-size:14.5px;">💚 捐 NT$' + fmt(donateAmt) + '</button></div>';
    actionZone.innerHTML = '';
    actionZone.appendChild(el);
    var decide = once(function(donate){
      if(donate){
        charityLeft[turnIndex] += 3;
        cash[turnIndex] -= donateAmt;
        if(isBot(turnIndex)){ logBotAction('💚 捐款 NT$' + fmt(donateAmt) + '（換接下來 3 輪擲 2 顆骰子）'); }
        refreshStats();
      }
      goToNextPlayer();
    });
    var btns = el.querySelectorAll('button');
    for(var i=0;i<btns.length;i++){
      (function(btn){
        btn.addEventListener('click', function(){
          decide(btn.getAttribute('data-donate')==='1');
        });
      })(btns[i]);
    }
    if(isBot(turnIndex)){
      var willDonate = botDecideCharity(donateAmt);
      botDelay(function(){ decide(willDonate); });
    }
  }

  // ================= reset =================
  function resetGame(){
    if(!confirm('要重新開始嗎？這會清空目前的組別與棋盤進度（紙本記錄不受影響）。')) return;
    gameScreen.classList.add('hidden');
    settlementScreen.classList.add('hidden');
    introScreen.classList.remove('hidden');
    document.getElementById('groupNameInput').value = '';
    currentPlayer = 0;
    players = [];
    turnIndex = 0;
    tokenPos = []; jobRest = []; charityLeft = []; kidsCount = [];
    cash = []; passiveIncome = []; expenseAdj = []; ownedAssets = []; eliminated = []; turnsTaken = [];
    hasPet = []; ownedInsurance = []; elderCount = []; familyEventCount = []; badges = [];
    professionBag = [];
    soloMode = false; isComputer = [];
    gameEnded = null; lastStockPrice = {};
    roundNumber = 1; pendingSettleRoundsLeft = null;
    updateRoundLabel();
    updateSettleCountdownLabel();
    settleBtnGame.disabled = false;
    settleBtnGame.classList.remove('disabled');
    var soloOptReset = document.getElementById('soloOpt');
    if(soloOptReset){ soloOptReset.classList.remove('active'); }
    refreshStats();
  }
  document.getElementById('resetBtn').addEventListener('click', resetGame);

})();
</script>
